# Optional drop-in when cage cannot find the HDMI connector
# (common on Raspberry Pi: V3D is card1, HDMI is card0 — or the reverse).
#
#   ls -l /sys/class/drm
#   sudo install -D -m 644 systemd/kiosk-drm.example.conf \
#     /etc/systemd/system/vox-kiosk.service.d/drm.conf
#   # then edit VOX_OUTPUT to match your connector (HDMI-A-1, HDMI-A-2, …)
#   sudo systemctl daemon-reload && sudo systemctl restart vox-kiosk
#
[Service]
Environment=WLR_BACKENDS=drm
# Point at the DRM card that owns the HDMI connector, not the 3D-only card.
Environment=WLR_DRM_DEVICES=/dev/dri/card0
# Environment=VOX_OUTPUT=HDMI-A-1
# Environment=VOX_MODE=1280x720
